name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: shellcheck
        run: shellcheck -x scripts/*.sh tests/*.sh
      - name: bash syntax check
        run: for f in scripts/*.sh tests/*.sh; do bash -n "$f"; done
      - name: guard behaviour tests
        run: |
          bash tests/op-read-guard.test.sh
          bash tests/secret-mask-guard.test.sh
          bash tests/read-secret-guard-bash.test.sh
      - name: validate JSON
        run: |
          jq empty .claude-plugin/plugin.json
          jq empty .claude-plugin/marketplace.json
          jq empty hooks/hooks.json
