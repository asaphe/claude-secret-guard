name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: shellcheck
        run: shellcheck -x scripts/*.sh tests/*.sh
      - name: bash syntax check
        run: for f in scripts/*.sh tests/*.sh; do bash -n "$f"; done
      - name: guard behaviour tests
        # Globbed rather than listed, so a suite added later cannot pass CI by never running.
        run: |
          shopt -s nullglob
          suites=(tests/*.test.sh)
          [ "${#suites[@]}" -gt 0 ] || { echo "no test suites found"; exit 1; }
          for t in "${suites[@]}"; do echo "== $t"; bash "$t"; done
      - name: validate JSON
        run: |
          jq empty .claude-plugin/plugin.json
          jq empty .claude-plugin/marketplace.json
          jq empty hooks/hooks.json
